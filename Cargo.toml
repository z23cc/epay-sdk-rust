[package]
name = "epay-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "EPay (易支付) SDK for Rust — 彩虹易支付 V1 compatible client with an axum integration"
license = "MIT"
readme = "README.md"
repository = "https://github.com/z23cc/epay-sdk-rust"
documentation = "https://docs.rs/epay-sdk"
keywords = ["epay", "payment", "alipay", "wechat", "sdk"]
categories = ["api-bindings", "web-programming"]
exclude = [".git", ".gitignore"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["reqwest-rustls"]
reqwest-rustls = ["dep:reqwest", "reqwest/rustls-tls", "dep:tokio", "tokio/time"]
reqwest-native-tls = ["dep:reqwest", "reqwest/native-tls", "dep:tokio", "tokio/time"]
axum = ["dep:axum"]
blocking = ["dep:tokio", "tokio/rt"]
tracing = ["dep:tracing"]
test-util = []

[dependencies]
constant_time_eq = "0.3"
log = "0.4"
md-5 = "0.10"
percent-encoding = "2"
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
zeroize = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "stream"], optional = true }
axum = { version = "0.8", default-features = false, optional = true }
tokio = { version = "1", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
env_logger = "0.11"
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies.axum]
version = "0.8"
features = ["http1", "tokio"]

[[example]]
name = "form_payment"

[[example]]
name = "axum_server"
required-features = ["axum"]
