name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (all features)
        if: matrix.toolchain == 'stable'
        run: cargo test --all-features
      - name: Check on MSRV (all targets, all features)
        if: matrix.toolchain != 'stable'
        run: cargo check --all-features --all-targets

  lint:
    name: fmt, clippy, docs, feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Feature matrix (all targets, so tests compile in every combination)
        run: |
          cargo check --all-targets --no-default-features
          cargo check --all-targets --no-default-features --features axum
          cargo check --all-targets --no-default-features --features reqwest-native-tls
          cargo check --all-targets --no-default-features --features blocking
          cargo check --all-targets --no-default-features --features tracing
          cargo check --all-targets --no-default-features --features test-util
          cargo check --all-targets --features blocking,tracing,axum
      - name: Tests without reqwest
        run: cargo test --no-default-features --features axum,test-util
      - name: Docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --all-features
